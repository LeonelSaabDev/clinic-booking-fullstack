name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/ClinicBooking.slnx

      - name: Build
        run: dotnet build backend/ClinicBooking.slnx --no-restore --configuration Release

      # The integration tests start SQL Server with Testcontainers; GitHub's Ubuntu runners already have Docker.
      - name: Test
        run: dotnet test backend/ClinicBooking.slnx --no-build --configuration Release

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Only proves the images still build; the values are dummies because nothing is started.
      - name: Build images
        run: docker compose build
        env:
          SQL_SA_PASSWORD: ci-only-not-used
          JWT_SIGNING_KEY: ci-only-not-used-ci-only-not-used
