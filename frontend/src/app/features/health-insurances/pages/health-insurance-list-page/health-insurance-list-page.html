<h1>Health insurances</h1>
<a routerLink="/health-insurances/new">New health insurance</a>

@if (healthInsurances.isLoading()) {
  <p>Loading...</p>
} @else if (healthInsurances.error()) {
  <p>The health insurances could not be loaded.</p>
} @else {
  <app-health-insurance-table
    [healthInsurances]="healthInsurances.value() ?? []"
    (rename)="renameHealthInsurance($event)"
    (delete)="deleteHealthInsurance($event)"
  />
}
