@if (healthInsurances().length === 0) {
  <p class="empty">No health insurances yet. Create the first one to get started.</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th><span class="visually-hidden">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      @for (healthInsurance of healthInsurances(); track healthInsurance.id) {
        <tr>
          <td>{{ healthInsurance.name }}</td>
          <td class="actions">
            <button type="button" class="btn ghost" (click)="rename.emit(healthInsurance)">
              Rename
            </button>
            <button type="button" class="btn ghost danger" (click)="delete.emit(healthInsurance)">
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
