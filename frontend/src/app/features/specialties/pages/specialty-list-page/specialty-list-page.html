<h1>Specialties</h1>
<a routerLink="/specialties/new">New specialty</a>

@if (specialties.isLoading()) {
  <p>Loading...</p>
} @else if (specialties.error()) {
  <p>The specialties could not be loaded.</p>
} @else {
  <app-specialty-table
    [specialties]="specialties.value() ?? []"
    (rename)="renameSpecialty($event)"
    (delete)="deleteSpecialty($event)"
  />
}
