@if (specialties().length === 0) {
  <p class="empty">No specialties yet. Create the first one to get started.</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th><span class="visually-hidden">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      @for (specialty of specialties(); track specialty.id) {
        <tr>
          <td>{{ specialty.name }}</td>
          <td class="actions">
            <button type="button" class="btn ghost" (click)="rename.emit(specialty)">Rename</button>
            <button type="button" class="btn ghost danger" (click)="delete.emit(specialty)">
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
