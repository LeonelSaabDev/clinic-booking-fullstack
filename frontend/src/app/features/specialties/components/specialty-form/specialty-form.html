<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <div class="label-row">
      <label for="name">Name</label>
      <span class="counter">{{ form.controls.name.value.length }}/{{ nameMaxLength }}</span>
    </div>
    <input id="name" type="text" formControlName="name" placeholder="e.g. Cardiology" />
    @if (form.controls.name.touched && form.controls.name.errors; as errors) {
      @if (errors['required']) {
        <span class="field-error">Name is required.</span>
      }
      @if (errors['maxlength']) {
        <span class="field-error">Name cannot exceed {{ nameMaxLength }} characters.</span>
      }
    }
  </div>

  <div class="form-actions">
    <button type="button" class="btn secondary" (click)="cancel.emit()">Cancel</button>
    <button type="submit" class="btn" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save specialty' }}
    </button>
  </div>
</form>
