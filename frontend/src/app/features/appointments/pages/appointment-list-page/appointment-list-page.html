<header class="page-header">
  <div>
    <p class="eyebrow">{{ isDoctor() ? 'Doctor' : 'Front desk' }}</p>
    <h1>{{ isDoctor() ? 'My agenda' : 'Appointments' }}</h1>
  </div>
  @if (!isDoctor()) {
    <a class="btn" routerLink="/appointments/new">Book appointment</a>
  }
</header>

<div class="filters">
  <div class="field">
    <label for="day">Day</label>
    <input id="day" type="date" [value]="selectedDate()" (change)="changeDate($any($event.target).value)" />
  </div>
  @if (!isDoctor()) {
    <div class="field">
      <label for="doctorFilter">Doctor</label>
      <select id="doctorFilter" [value]="doctorFilter()" (change)="doctorFilter.set($any($event.target).value)">
        <option value="">All doctors</option>
        @for (doctor of doctors.value() ?? []; track doctor.id) {
          <option [value]="doctor.id">{{ doctor.lastName }}, {{ doctor.firstName }}</option>
        }
      </select>
    </div>
  }
</div>

<div class="card">
  @if (isLoading()) {
    <p class="empty">Loading appointments...</p>
  } @else if (hasError()) {
    <p class="empty">The appointments could not be loaded.</p>
  } @else {
    <app-appointment-table
      [appointments]="rows()"
      (cancel)="cancel($event)"
      (complete)="complete($event)"
      (noShow)="markNoShow($event)"
    />
  }
</div>
